[package]
name = "umamurl"
version = "1.0.0"
edition = "2024"
# The toolchain the Nix build uses (nixpkgs pin). Keeps `cargo update` from
# picking crates that only build with a newer local rustc.
rust-version = "1.97"
authors = ["Emmanuel Salomon <emmanuel.salomon@gmail.com>"]
license = "mit"
description = "A fast, lightweight URL shortener with built-in Umami analytics."
homepage = "https://github.com/ManUtopiK/umamurl"
documentation = "https://github.com/ManUtopiK/umamurl"
repository = "https://github.com/ManUtopiK/umamurl"
readme = "README.md"
keywords = [
    "rust",
    "self-hosted",
    "url-shortener",
    "link-shortener",
    "umami",
    "analytics",
    "actix-web",
]
categories = ["web-programming"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
# Default features minus `http2`: the server binds plain TCP without TLS, so
# it only ever speaks HTTP/1.1. actix-http's HTTP/2 stack was
# compiled but unreachable, and it pins h2 0.3 (RUSTSEC-2026-0258, no fix).
actix-web = { version = "4.15.0", default-features = false, features = ["macros", "compress-brotli", "compress-gzip", "compress-zstd", "cookies", "unicode", "compat", "ws"] }
actix-files = "0.7.0"
rusqlite = { version = "0.40.2", features = [ "bundled" ] }
regex = "1.12.3"
rand = "0.10.0"
passwords = "3.1.16"
actix-session = { version = "0.11.0", features = [ "cookie-session" ] }
nanoid = "0.5.0"
serde = { version = "1.0.228", features = [ "derive", "rc" ] }
serde_json = "1.0.149"
argon2 = "0.6.0"
chrono = "0.4.44"
tokio = "1.50.0"
log = "0.4.29"
env_logger = "0.11.9"
# rustls instead of the default native-tls: no OpenSSL to link, so the binary
# can be built fully static against musl. CA roots are compiled in
# (webpki-roots), so it does not depend on the host trust store either.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "charset", "http2", "system-proxy"] }
# musl's allocator serialises under concurrent load; mimalloc does not.
mimalloc = "0.1"

[dev-dependencies]
actix-http = "3.12.0"
actix-service = "2.0.3"
regex = "1.12.3"
